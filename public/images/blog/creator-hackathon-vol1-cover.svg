<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">创作者黑客松，两天做出一个能演示的东西</title>
  <desc id="desc">米白色编辑风封面，黄色爆炸框、奖杯和创作者工作台组成主视觉。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1f1c18" flood-opacity=".12"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1f1c18" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#f5f0e7"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <path d="M62 91 146 66 192 101 278 57 344 91 430 50 496 94 576 66 632 102 601 163 634 210 550 224 506 273 429 244 360 285 292 245 209 274 159 226 82 239 104 178Z"
        fill="#f4ca32" stroke="#1f1c18" stroke-width="8" stroke-linejoin="round" filter="url(#shadow)"/>
  <text x="112" y="152" fill="#1f1c18" font-size="40" font-weight="800" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">创作者黑客松 Vol.1</text>
  <text x="112" y="201" fill="#1f1c18" font-size="25" font-weight="600" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">8.1—8.2 · 上海 + 线上分会场</text>

  <text x="70" y="375" fill="#1f1c18" font-size="62" font-weight="800" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">两天，做出一个</text>
  <text x="70" y="455" fill="#1f1c18" font-size="76" font-weight="900" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">能演示的东西</text>
  <rect x="70" y="500" width="570" height="64" rx="10" fill="#d94b35"/>
  <text x="98" y="542" fill="#fff8ed" font-size="27" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">0→1 创作 · 二次开发 · Token 奖励</text>

  <g transform="translate(736 82)" filter="url(#shadow)">
    <rect width="390" height="470" rx="28" fill="#fffaf0" stroke="#1f1c18" stroke-width="6"/>
    <path d="M146 64h98v52c0 58-26 91-49 104-23-13-49-46-49-104Z" fill="#f4ca32" stroke="#1f1c18" stroke-width="6"/>
