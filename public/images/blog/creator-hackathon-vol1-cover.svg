    <text x="48" y="350" fill="#1f1c18" font-size="34" font-weight="900" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">$100,000</text>
    <text x="52" y="390" fill="#7d4d24" font-size="21" font-weight="700" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">等额 TOKEN 奖池</text>
    <path d="M52 418h286" stroke="#1f1c18" stroke-width="3" stroke-dasharray="7 8"/>
    <text x="52" y="452" fill="#1f1c18" font-size="18" font-weight="600" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">注意：Token 不等于现金</text>
  </g>

